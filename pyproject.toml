[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pok"
version = "0.0.1"
description = "PoK (Path of Knowledge) — PoE2 AI Wiki engine: KB + MCP tools + PoB-oracle build generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "skerfolg", email = "sk.erfolg@gmail.com" }]
# 런타임 의존성은 로드맵 단계별로 추가한다.
dependencies = [
    "jsonschema>=4.23",       # P1a: KB 레코드 스키마 검증 (KB_DATA_MODEL §9)
    "httpx>=0.27",            # P1b: ingest fetch (KB_INGEST §1)
    "beautifulsoup4>=4.12",   # P1b: poe2db HTML 파싱
    "fastmcp>=2.10",          # P2: MCP 서버 (D6/AD-4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
    "pre-commit>=3.8",
    "types-jsonschema>=4.23",
    "types-beautifulsoup4>=4.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pok"]

# ── 품질 도구 ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pok"]
mypy_path = "src"

[tool.pytest.ini_options]
# ⚠ 기본은 **단위만**이다. 통합은 PoB를 부팅하고 계산을 수백 회 돌려 파일당 수 분,
# 전량이면 30분~1시간이다 — 그걸 기본에 두면 기능 개발이 매 수정마다 멎는다
# (사용자 지시 2026-08-13: "평소 개발은 빠르게, 통합은 지시할 때만").
# ⛔ CI는 **경로를 명시해서** 부른다(`pytest tests`) — 여기만 좁히면 CI에서 통합이
#    조용히 빠진다. 그 대칭은 `tests/unit/test_ci_runs_integration.py`가 지킨다.
testpaths = ["tests/unit"]
addopts = "-q"
# editable 설치와 무관하게 src 임포트 보장 (일부 환경에서 .pth가 hidden 플래그로 무시됨)
pythonpath = ["src"]

# ── 계층 경계 강제 (PROJECT_STRUCTURE §4) ─────────────────────
# 위반 시 lint-imports 실패 → pre-commit·CI 실패.
# 같은 층의 "|" 구분 모듈은 서로 import 금지(독립).

[tool.importlinter]
root_package = "pok"

[[tool.importlinter.contracts]]
name = "의존 방향 단방향: mcp → engine → (index|pob|live|cost|learning|artifacts) → kb → (i18n|common)"
type = "layers"
layers = [
    "pok.mcp",
    "pok.engine",
    "pok.index | pok.pob | pok.live | pok.cost | pok.learning | pok.artifacts",
    "pok.kb",
    "pok.i18n | pok.common",
]

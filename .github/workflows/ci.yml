name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Windows 러너의 cp1252 콘솔이 한글 출력(계약 이름·로그)에서 UnicodeEncodeError를
  # 일으키므로 UTF-8 모드 강제 (D21 플랫폼 gotcha — 한국어 우선 프로젝트의 기반 설정)
  PYTHONUTF8: "1"
  # 카탈로그 검증(젬 id·config 키)이 읽는 PoB 소스. manifest.json의 pob_commit과
  # 같은 커밋을 가리켜야 한다 — 증거 체인 유지(AD-2: 새 버전은 새 클론).
  POB_REPO: https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git
  POB_COMMIT: 5d173cbf8c9cf394a975cbb813f19d0b6dc67ea6

jobs:
  test:
    # D21: Windows(주) + macOS 둘 다 항상 검증
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # PoB 소스에서 **읽기만 하는** 카탈로그 파일 3개(합계 1MB 미만)를 받는다.
      # 전체 클론은 758MB(.git 323MB 포함)라 PR마다 받을 것이 못 되고, 트리 데이터
      # (TreeData/0_5, 87MB)는 이미 KB에 수록돼 있어 필요 없다. sparse-checkout으로
      # 필요한 것만 — 실측 2026-08-07: 이 파일들이 없어 pytest 34건이 실패했다.
      # ⚠ HeadlessWrapper.lua는 **일부러 받지 않는다** — 그게 있으면 PoB 실행
      # 테스트가 skip을 멈추고 luajit 부재로 실패한다(러너에 luajit이 없다).
      - name: PoB catalog sources (sparse)
        shell: bash
        run: |
          set -euo pipefail
          dir="external/pob/${POB_COMMIT:0:7}"
          git init -q "$dir"
          git -C "$dir" remote add origin "$POB_REPO"
          git -C "$dir" config core.sparseCheckout true
          git -C "$dir" sparse-checkout set --no-cone \
            src/Data/Gems.lua src/Modules/ConfigOptions.lua src/Modules/Data.lua
          git -C "$dir" fetch --depth 1 -q origin "$POB_COMMIT"
          git -C "$dir" checkout -q FETCH_HEAD
          ls -l "$dir/src/Data/Gems.lua" "$dir/src/Modules/ConfigOptions.lua" \
                "$dir/src/Modules/Data.lua"
      - name: Lint (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Types (mypy)
        run: mypy
      - name: Layer boundaries (import-linter)   # PROJECT_STRUCTURE §4 — 위반 = 실패
        run: lint-imports
      - name: Tests (pytest)
        run: pytest

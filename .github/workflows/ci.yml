name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Windows 러너의 cp1252 콘솔이 한글 출력(계약 이름·로그)에서 UnicodeEncodeError를
  # 일으키므로 UTF-8 모드 강제 (D21 플랫폼 gotcha — 한국어 우선 프로젝트의 기반 설정)
  PYTHONUTF8: "1"
  # 카탈로그 검증(젬 id·config 키)이 읽는 PoB 소스. manifest.json의 pob_commit과
  # 같은 커밋을 가리켜야 한다 — 증거 체인 유지(AD-2: 새 버전은 새 클론).
  POB_REPO: https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git
  POB_COMMIT: 5d173cbf8c9cf394a975cbb813f19d0b6dc67ea6

jobs:
  test:
    # D21: Windows(주) + macOS 둘 다 항상 검증
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # PoB 소스에서 **읽기만 하는** 파일들을 받는다. 전체 클론은 758MB(.git 323MB
      # 포함)라 PR마다 받을 것이 못 되고, 트리 데이터(TreeData/0_5, 87MB)는 이미 KB에
      # 수록돼 있어 필요 없다 — 실측 2026-08-07: 이 파일들이 없어 pytest 34건이 실패.
      #
      # git sparse-checkout + --filter=blob:none 도 시도했으나 Windows 러너에서 파일이
      # 하나도 체크아웃되지 않았다(로컬 macOS에서는 되던 것이다 — 재현 환경이 달랐다).
      # 고정 커밋의 raw 파일을 그냥 받는 편이 플랫폼 차이가 없고 단순하다.
      #
      # ⚠ 목록은 `src/pok/pob/catalog.py`가 읽는 파일과 **함께 움직인다**. 실측
      # 2026-08-13: #68이 quest_config_vars()로 Data/QuestRewards.lua를 읽기
      # 시작했는데 여기 목록에 없어 pytest 16건이 FileNotFoundError로 죽었다
      # (mypy가 먼저 죽어 보이지도 않았다). 카탈로그가 새 파일을 열면 여기도 는다.
      #
      # ⚠ HeadlessWrapper.lua는 **일부러 받지 않는다** — 그게 있으면 PoB 실행 테스트가
      # skip을 멈추고 luajit 부재로 실패한다(러너에 luajit이 없다).
      # 상태이상 중첩 판정은 `<Ailment>CanStack`을 여는 출처를 src 전체에서 찾으므로
      # (rglob) 그 플래그가 실재하는 파일들도 함께 받는다.
      - name: PoB catalog sources
        shell: bash
        run: |
          set -euo pipefail
          dir="external/pob/${POB_COMMIT:0:7}/src"
          base="https://raw.githubusercontent.com/PathOfBuildingCommunity/PathOfBuilding-PoE2/$POB_COMMIT"
          for f in Data/Gems.lua Data/Misc.lua Data/ModCache.lua Data/Skills/sup_dex.lua \
                   Data/QuestRewards.lua \
                   Modules/ConfigOptions.lua Modules/Data.lua Modules/ModParser.lua \
                   Modules/CalcPerform.lua; do
            mkdir -p "$dir/$(dirname "$f")"
            curl -fsSL --retry 3 -o "$dir/$f" "$base/src/$f"
          done
          du -sh "$dir"
      - name: Lint (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Types (mypy)
        run: mypy
      - name: Layer boundaries (import-linter)   # PROJECT_STRUCTURE §4 — 위반 = 실패
        run: lint-imports
      - name: Tests (pytest)
        run: pytest
